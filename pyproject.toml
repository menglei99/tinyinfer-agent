[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyinfer-agent"
version = "0.1.0"
description = "AI inference framework regression test agent"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.5",
    "numpy>=1.24",
    "onnxruntime>=1.16",
    "typer>=0.12",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
]
anthropic = ["langchain-anthropic>=0.2.0"]
# Default RAG stack: BM25 lexical + Chroma dense vector store. Chroma is
# embedded (sqlite-backed) and installs cleanly on Windows without Docker.
rag = [
    "rank-bm25>=0.2.2",
    "chromadb>=0.5",
]
# Optional: Qdrant local mode (also embedded, richer filter syntax).
rag-qdrant = ["qdrant-client>=1.10"]
# Optional: legacy Milvus stack (milvus-lite for embedded; pymilvus for server).
rag-milvus = [
    "pymilvus>=3.0",
    "milvus-lite>=3.0",
]
ui = ["streamlit>=1.32"]

[project.scripts]
tinyinfer-agent = "agent.cli:app"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: tests that spawn subprocesses or take >5s",
]
