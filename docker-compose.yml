# Optional services for tinyinfer-agent.
#
# The default vector store is Chroma (embedded sqlite) — no daemon required.
# This file is only for users who want to run a "real" server-backed vector DB
# or a Qdrant server instead of the embedded mode.
#
# Bring up a single service:
#     docker compose up -d qdrant
#     docker compose up -d milvus-standalone
#
# Then point the agent at it:
#     export VECTOR_STORE_BACKEND=qdrant
#     export QDRANT_URL=http://localhost:6333
#
# DEFERRED VALIDATION: this file is written and reviewed but the stacks have
# not been brought up on this dev machine. See docs/DEFERRED_VALIDATION.md.

services:
  # Qdrant — single-container server. Easiest to run.
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: tinyinfer-qdrant
    ports:
      - "6333:6333"  # HTTP + gRPC
      - "6334:6334"  # gRPC alternative port
    volumes:
      - ./qdrant_data:/qdrant/storage

  # Milvus standalone — heavier, brings etcd + minio.
  # Skip the milvus group unless you specifically need server mode.
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: tinyinfer-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./milvus_data/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    profiles: ["milvus"]

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: tinyinfer-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./milvus_data/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    profiles: ["milvus"]

  milvus-standalone:
    image: milvusdb/milvus:v2.4.18
    container_name: tinyinfer-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./milvus_data/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    profiles: ["milvus"]
